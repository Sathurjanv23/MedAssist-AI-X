name: MedAssist Frontend CI

on:
  push:
    branches: [ main, master, frontend, dev ]
    paths:
      - 'medassist-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, master, frontend, dev ]
    paths:
      - 'medassist-frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: medassist-frontend/package-lock.json

      - name: Install Dependencies & Build
        run: |
          cd medassist-frontend
          npm ci
          npm run build
