# ══════════════════════════════════════════════════════════════════════════════
# Production Profile — application-prod.properties
# ALL values MUST come from environment variables / secrets manager
# ══════════════════════════════════════════════════════════════════════════════

# ── MongoDB Atlas ─────────────────────────────────────────────────────────────
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE}

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ── Redis (AWS ElastiCache) ───────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true

# ── AWS ───────────────────────────────────────────────────────────────────────
aws.region=${AWS_REGION}
aws.access-key=${AWS_ACCESS_KEY_ID}
aws.secret-key=${AWS_SECRET_ACCESS_KEY}
aws.s3.bucket=${AWS_S3_BUCKET}
aws.ses.from-email=${AWS_SES_FROM_EMAIL}

# ── AI ────────────────────────────────────────────────────────────────────────
ai.service.url=${AI_SERVICE_URL}
ai.model.default=${AI_MODEL_DEFAULT:llama3.2}

# ── OCR ───────────────────────────────────────────────────────────────────────
ocr.service.url=${OCR_SERVICE_URL}

# ── Logging (production — no debug) ──────────────────────────────────────────
logging.level.com.medassist=WARN
logging.level.org.springframework=WARN
logging.level.root=ERROR
logging.file.name=/var/log/medassist/application.log
logging.logback.rollingpolicy.max-file-size=100MB
logging.logback.rollingpolicy.max-history=30

# ── Security hardening ────────────────────────────────────────────────────────
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=20
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20000

# ── Swagger (disabled in production) ─────────────────────────────────────────
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ── Actuator (restrict in prod) ───────────────────────────────────────────────
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
