# ══════════════════════════════════════════════════════════════════════════════
# MedAssist AI X — Base Application Configuration
# Active profile overrides this file. Never put secrets here.
# ══════════════════════════════════════════════════════════════════════════════

spring.application.name=medassist-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.error.include-message=never
server.error.include-stacktrace=never

# ── MongoDB ───────────────────────────────────────────────────────────────────
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/medassist_db}
spring.data.mongodb.database=${MONGODB_DATABASE:medassist_db}
spring.data.mongodb.auto-index-creation=true

# ── Redis ─────────────────────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=5
spring.data.redis.lettuce.pool.min-idle=2

# ── Cache ─────────────────────────────────────────────────────────────────────
spring.cache.type=redis
spring.cache.redis.time-to-live=1800000
spring.cache.redis.cache-null-values=false

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
jwt.issuer=medassist-ai-x

# ── File Upload ───────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${FILE_MAX_SIZE:20MB}
spring.servlet.multipart.max-request-size=25MB
file.allowed-types=application/pdf,image/jpeg,image/png,image/jpg,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document

# ── AWS ───────────────────────────────────────────────────────────────────────
aws.region=${AWS_REGION:ap-south-1}
aws.access-key=${AWS_ACCESS_KEY_ID:}
aws.secret-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.bucket=${AWS_S3_BUCKET:medassist-medical-files}
aws.ses.from-email=${AWS_SES_FROM_EMAIL:noreply@medassist.ai}

# ── AI / Ollama ───────────────────────────────────────────────────────────────
ai.service.url=${AI_SERVICE_URL:http://localhost:11434}
ai.model.default=${AI_MODEL_DEFAULT:llama3.2}
ai.model.medical=${AI_MODEL_MEDICAL:llama3.2}
ai.request.timeout=${AI_REQUEST_TIMEOUT:120s}
ai.request.max-retries=${AI_REQUEST_MAX_RETRIES:2}

# ── OCR ───────────────────────────────────────────────────────────────────────
ocr.service.url=${OCR_SERVICE_URL:http://localhost:8866}
ocr.request.timeout=60s

# ── Spring Mail ───────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Actuator / Health ─────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always
management.metrics.export.prometheus.enabled=true
management.info.env.enabled=true
info.app.name=MedAssist AI X
info.app.version=@project.version@
info.app.description=Your Personal AI Healthcare Operating System

# ── SpringDoc / Swagger ───────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.packages-to-scan=com.medassist.controller
springdoc.show-actuator=false

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.medassist=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.data.mongodb=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{userId}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{userId}] %logger{36} - %msg%n

de.flapdoodle.mongodb.embedded.version=7.0.0
