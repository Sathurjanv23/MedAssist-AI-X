# ══════════════════════════════════════════════════════════════════════════════
# Test Profile — application-test.properties
# ══════════════════════════════════════════════════════════════════════════════

# Use embedded/Testcontainers MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/medassist_test}
spring.data.mongodb.database=medassist_test

# Disable Redis for tests (use simple cache)
spring.cache.type=simple
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# JWT
jwt.secret=${JWT_SECRET:test-jwt-secret-test-jwt-secret-test-jwt-secret-test-jwt-secret}
jwt.expiration=3600000
jwt.refresh-expiration=86400000

# Disable external services in tests
ai.service.url=http://localhost:11434
ocr.service.url=http://localhost:8866
aws.access-key=${AWS_ACCESS_KEY_ID:test}
aws.secret-key=${AWS_SECRET_ACCESS_KEY:test}
aws.s3.bucket=${AWS_S3_BUCKET:medassist-test}

# Mail - disable
spring.mail.host=localhost
spring.mail.port=1025

# Logging
logging.level.com.medassist=DEBUG
logging.level.org.springframework.security=WARN
