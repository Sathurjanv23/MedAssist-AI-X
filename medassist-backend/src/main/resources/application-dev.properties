# ══════════════════════════════════════════════════════════════════════════════
# Development Profile — application-dev.properties
# ══════════════════════════════════════════════════════════════════════════════

# ── MongoDB Atlas ─────────────────────────────────────────────────────────────
# Replace YOUR_CLUSTER_HOST with your Atlas cluster hostname (e.g. cluster0.abc12de.mongodb.net)
# spring.data.mongodb.uri=
spring.data.mongodb.database=medassist_db

# ── JWT (dev value comes from env when available) ────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ── Redis ─────────────────────────────────────────────────────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

# ── AI Ollama ─────────────────────────────────────────────────────────────────
ai.service.url=http://localhost:11434
ai.model.default=llama3.2

# ── OCR ───────────────────────────────────────────────────────────────────────
ocr.service.url=http://localhost:8866

# ── AWS (use localstack in dev) ───────────────────────────────────────────────
aws.region=${AWS_REGION:ap-south-1}
aws.access-key=${AWS_ACCESS_KEY_ID:test}
aws.secret-key=${AWS_SECRET_ACCESS_KEY:test}
aws.s3.bucket=${AWS_S3_BUCKET:medassist-dev}

# ── Logging (verbose in dev) ──────────────────────────────────────────────────
logging.level.com.medassist=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.data.mongodb.core=DEBUG

# ── Swagger (enabled in dev) ──────────────────────────────────────────────────
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
